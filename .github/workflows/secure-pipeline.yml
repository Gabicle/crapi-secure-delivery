name: Secure Delivery Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install Gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (current-state scan)
        run: |
          gitleaks dir app --report-format json --report-path gitleaks-report.json --exit-code 0

      - name: Check findings against policy
        run: |
          pip install pyyaml
          python3 security/scripts/gate.py secrets gitleaks-report.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sast:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Checkout repository and submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run Semgrep (JSON, for gate)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" returntocorp/semgrep:latest \
            semgrep scan --config auto /repo/app --json --output /repo/semgrep-report.json

      - name: Run Semgrep (SARIF, for Security tab)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" returntocorp/semgrep:latest \
            semgrep scan --config auto /repo/app --sarif --output /repo/semgrep-report.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif

      - name: Check findings against policy
        run: |
          pip install pyyaml
          python3 security/scripts/gate.py sast semgrep-report.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  sca:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout repository and submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run Trivy (JSON, for gate)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:0.74.0 \
            fs /repo/app --format json --output /repo/trivy-report.json

      - name: Run Trivy (SARIF, for Security tab)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:0.74.0 \
            fs /repo/app --format sarif --output /repo/trivy-report.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif

      - name: Check findings against policy
        run: |
          pip install pyyaml
          python3 security/scripts/gate.py sca trivy-report.json

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  iac:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout repository and submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run Checkov
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" bridgecrew/checkov:latest \
            -d /repo/app --output json --output-file-path /repo/checkov-report --soft-fail

      - name: Check findings against policy
        run: |
          pip install pyyaml
          python3 security/scripts/gate.py iac checkov-report/results_json.json

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report/results_json.json

  build:
    runs-on: ubuntu-latest
    needs: iac
    steps:
      - run: echo "build stage placeholder"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "deploy stage placeholder"

  dast:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: echo "dast stage placeholder"
